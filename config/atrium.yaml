# Task 2: the atrium scene. Frame: aeb_level1.sdf world frame (meters), origin = Central Lobby (100).
# Source world: tourbot branch aidan/sim-levels-2-3 2757cf1, ros2_ws/src/tourbot_sim/worlds/aeb_level1.sdf.

square:
  center: [0.0, 0.0]
  side: 3.048                 # 10 ft
building:
  sdf_commit: 2757cf1
  margin: 3.0                 # import boxes within this distance of the square's edge
  kinds: [wall, glass, rail, low, stairs, barrier, closed_door]

robot:
  footprint: [0.70, 0.31]     # length, width, m (Unitree Go2 page: standing 70 x 31 x 40 cm)
  front_offset: 0.35          # base origin to the front edge, m
  start_clearance: 0.15       # free space required around the start footprint, m
  start_margin: 0.40          # start center at least this far inside the square's edge, m

obstacles:
  chair:
    count: [0, 3]             # inclusive
    footprint: [0.50, 0.50]
    seat_height: 0.45
    back_height: 0.85
    back_thickness: 0.06
    colors:                   # name: RGB
      red: [0.80, 0.12, 0.10]
      blue: [0.10, 0.25, 0.80]
      green: [0.10, 0.60, 0.20]
      yellow: [0.90, 0.80, 0.10]
  table:
    probability: 0.5
    footprint: [1.20, 0.75]
    height: 0.75
    top_thickness: 0.04
    leg_size: 0.05
  person:
    count: [0, 2]
    radius: 0.25              # tourbot_rl models/visitor.sdf
    height: 1.7
    walking_probability: 0.5  # otherwise standing still
    speed: [0.5, 1.2]         # m/s while walking
    pause_probability: 0.25   # per segment of the speed script (tourbot_rl pedestrian.py idea)
    segment_duration: [2.0, 5.0]
  gap: 0.10                   # minimum free space between static obstacles, m
  inside_margin: 0.0          # obstacle footprints lie fully inside the square
  park:                       # unused obstacles wait here, outside the square (env frame)
    x0: 6.0
    y0: -4.0
    spacing: 1.5
  max_tries: 200

reachability:
  grid_resolution: 0.05       # m
  inflate: 0.20               # robot half width plus a little, m
  goal_distance: 0.5          # success: front within this distance of the target footprint

collision:
  contact_force_threshold: 1.0  # N, robot body to obstacle
  person_near_distance: 0.5     # m, footprint to person footprint, for the proximity penalty

episode:
  length_s: 20.0
