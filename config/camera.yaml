# Task 3: the fixed virtual camera, in the aeb_level1 world frame (meters).
# Mounted above the lobby railing on the +x side (rail_4163 is near (2.95, 0.50)), tilted down at the square.

intrinsics:
  width: 640
  height: 480
  hfov_deg: 60.0              # fx = fy = (width / 2) / tan(hfov / 2); principal point at the image center
  # 90 deg also covers the square but leaves it about 300 x 200 pixels (2 pixels per 5.7 cm at the far edge);
  # 60 deg gives 3.4 pixels per 5.7 cm and keeps every check point at least 33 pixels inside the image.
pose:
  position: [3.0, 0.0, 4.0]
  look_at: [0.0, 0.0, 0.0]    # aim point on the floor: the square center
  up: [0.0, 0.0, 1.0]
coverage:
  margin: 0.3                 # the square plus this margin must be visible
  robot_height: 0.4           # robot top at any point inside the square must be visible
  edge_pixels: 2              # projected points must be at least this far inside the image border
rendering:
  num_scenes: 60              # rendered RGB check scenes (at least 50)
  seed: 5000
