# Mac environment: simulation, RL training on CPU, tests against the mock robot.
# conda-forge only, as in Exam 1 (q2_sdk/LOG.md).
#   conda env create -p .venv -f env/environment-mac.yml
#   .venv/bin/pip install -e . --no-deps
# Versions are those conda-forge resolved for osx-arm64 on 2026-10-14.
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11.17
  - pip
  - numpy=2.4.6
  - gymnasium=1.3.0
  - stable-baselines3=2.9.0
  - pytorch=2.14.1
  - matplotlib=3.11.2
  - pyyaml=6.0.3
  - pytest=9.1.1
  - imageio=2.38.1
  - imageio-ffmpeg=0.6.0
