# Ubuntu 24.04 laptop environment: simulation and RL (CUDA), plus both robot libraries.
# conda-forge only, as in Exam 1 (q2_sdk/LOG.md). Upstream commits follow Exam 1.
#
# Before creating it (system packages, as in Exam 1):
#   sudo apt install build-essential cmake portaudio19-dev
# portaudio19-dev is needed to build pyaudio, a dependency of unitree_webrtc_connect.
#
#   conda env create -p .venv -f env/environment-ubuntu.yml
#   .venv/bin/pip install -e . --no-deps
#
# unitree_sdk2py is NOT listed here: it must build against CycloneDDS 0.10.x from source,
# with CYCLONEDDS_HOME set, exactly as in Exam 1. Steps are in docs/LAPTOP_SESSION.md:
#   git clone -b releases/0.10.x https://github.com/eclipse-cyclonedds/cyclonedds ~/go2_deps/cyclonedds
#   (checkout 5041f35, cmake build, install to ~/go2_deps/cyclonedds/install)
#   git clone https://github.com/unitreerobotics/unitree_sdk2_python ~/go2_deps/unitree_sdk2_python
#   (checkout 814556d)
#   CYCLONEDDS_HOME=~/go2_deps/cyclonedds/install .venv/bin/pip install -e ~/go2_deps/unitree_sdk2_python
#
# Versions are those conda-forge resolved for linux-64 on 2026-10-14 (pytorch CUDA 12.9 build).
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11.17
  - pip
  - numpy=2.4.6
  - gymnasium=1.3.0
  - stable-baselines3=2.9.0
  - pytorch=2.14.1=cuda*
  - matplotlib=3.11.2
  - pyyaml=6.0.3
  - pytest=9.1.1
  - imageio=2.38.1
  - imageio-ffmpeg=0.6.0
  - pip:
      - unitree_webrtc_connect @ git+https://github.com/legion1581/unitree_webrtc_connect@e0abc5780761539eff89a382a79319e5cf6ad1f4
